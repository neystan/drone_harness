name: real
mode: real
post_motion_wait_enabled: true  # 动作完成后等待再规划；false 关闭。
post_motion_wait_s: 2.0  # 等待秒数，可直接修改。

ros:
  node_name: drone_harness_real
  camera_scene_topic: null
  camera_depth_topic: null
  camera_depth_info_topic: null

storage:
  save_observation_images: false
  photo_save_dir: /home/hw/picture_real
  analysis_save_dir: /home/hw/picture_real/analysis_frames
  log_dir: /home/hw/drone_harness_logs/real

observation:
  max_frame_age_s: 0.5
  max_sync_delta_s: 0.05
  max_clock_skew_s: 0.05
  wait_timeout_s: 2.0
  depth_semantics: unverified
  depth_max_m: 20.0
  camera_forward_offset_m: 0.0
  body_front_offset_m: 0.55
  body_half_width_m: 0.45
  body_half_height_m: 0.30
  measurement_margin_m: 0.15
  braking_margin_m: 25.0
  latency_margin_m: 0.25
  side_obstacle_distance_m: 2.0  # 兼容旧配置；左右数值现采用 depth_max_m 量程。

safety:
  human_in_the_loop_for_flight_tools: true
  human_in_the_loop_exempt_flight_tools: []
  max_takeoff_height_m: 3
  max_relative_move_m: 0.2
  max_vertical_move_m: 2
  max_rotation_deg: 180
  action_timeout_s: 20
  hover_on_timeout: true
  pre_takeoff_gate_enabled: true
  require_battery_status_for_takeoff: true
  min_battery_percent_for_takeoff: 30
  require_px4_status_ready_for_takeoff: true
