name: sim
mode: simulation
post_motion_wait_enabled: true  # 动作完成后等 2 秒再规划；false 关闭。

ros:
  node_name: drone_harness_sim
  camera_scene_topic: /airsim_node/PX4/CameraDepth1/Scene
  camera_depth_topic: /airsim_node/PX4/CameraDepth1/DepthPerspective
  camera_depth_info_topic: /airsim_node/PX4/CameraDepth1/DepthPerspective/camera_info
  mavros_namespace: /mavros
  mavros_fcu_url: udp://:14540@127.0.0.1:14580

storage:
  photo_save_dir: /home/stan/AirVLN/drone_harness_runtime/picture
  analysis_save_dir: /home/stan/AirVLN/drone_harness_runtime/picture/analysis_frames
  log_dir: /home/stan/AirVLN/drone_harness_runtime/logs/sim

observation:
  max_frame_age_s: 1.0
  max_sync_delta_s: 0.05
  max_clock_skew_s: 0.05
  wait_timeout_s: 2.0
  # 仅 scene 9/13/21/24 已抽测米制；scene 7 的旧起点不可用于自主前进。
  depth_semantics: perspective_ray_m
  depth_max_m: 20.0
  camera_forward_offset_m: 0.5
  body_front_offset_m: 0.55
  body_half_width_m: 0.45
  body_half_height_m: 0.30
  measurement_margin_m: 0.15
  # 与测量 0.15m、延迟 0.25m 合计预留 1m 的计划净空；并非实测停距保证。
  braking_margin_m: 0.60
  latency_margin_m: 0.25
  side_obstacle_distance_m: 2.0  # 兼容旧配置；左右数值现采用 depth_max_m 量程。

safety:
  human_in_the_loop_for_flight_tools: false
  max_takeoff_height_m: 10
  max_relative_move_m: 0.3
  max_forward_m: 19.0
  max_vertical_move_m: 10
  max_rotation_deg: 360
  action_timeout_s: 30
  hover_on_timeout: true
  pre_takeoff_gate_enabled: false
  require_battery_status_for_takeoff: false
  min_battery_percent_for_takeoff: 0
  require_px4_status_ready_for_takeoff: false
